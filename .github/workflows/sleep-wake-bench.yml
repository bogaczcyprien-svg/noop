# TEMPORARY — onset + wake benchmark for the sleep-wake-precision branch. Runs Tools/SleepPSG sections 8-9
# against PhysioNet sleep-accel (ODC-By 1.0). Removed before this branch merges.
name: Sleep wake bench (temporary)

on:
  push:
    branches: [sleep-wake-precision]
    paths:
      - 'Tools/SleepPSG/**'
      - 'Packages/StrandAnalytics/**'
      - 'android/app/src/**'
      - '.github/workflows/sleep-wake-bench.yml'

permissions:
  contents: read

jobs:
  onset:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download sleep-accel
        timeout-minutes: 15
        run: |
          # PhysioNet's open-data mirror on AWS; the physionet.org zip took over 30 minutes.
          mkdir -p "$RUNNER_TEMP/ds"
          aws s3 sync --no-sign-request --only-show-errors \
            s3://physionet-open/sleep-accel/1.0.0/ "$RUNNER_TEMP/ds/"
          ls "$RUNNER_TEMP/ds"
      - name: Onset report
        working-directory: Tools/SleepPSG
        run: swift run -c release sleeppsg --dataset "$RUNNER_TEMP/ds" --section onset
      - name: Wake report
        working-directory: Tools/SleepPSG
        run: swift run -c release sleeppsg --dataset "$RUNNER_TEMP/ds" --section wake

  swift-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: StrandAnalytics tests
        working-directory: Packages/StrandAnalytics
        run: swift test
      - name: SleepPSG tests (port validation)
        working-directory: Tools/SleepPSG
        run: swift test

  kotlin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testFullDebugUnitTest
