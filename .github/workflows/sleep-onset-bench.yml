# TEMPORARY — onset benchmark for the sleep-onset-precision branch. Runs Tools/SleepPSG section 8
# against PhysioNet sleep-accel (ODC-By 1.0). Removed before this branch merges.
name: Sleep onset bench (temporary)

on:
  push:
    branches: [sleep-onset-precision]
    paths:
      - 'Tools/SleepPSG/**'
      - 'Packages/StrandAnalytics/Sources/**'
      - '.github/workflows/sleep-onset-bench.yml'

permissions:
  contents: read

jobs:
  onset:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Download sleep-accel
        timeout-minutes: 15
        run: |
          # PhysioNet's open-data mirror on AWS; the physionet.org zip took over 30 minutes.
          mkdir -p "$RUNNER_TEMP/ds"
          aws s3 sync --no-sign-request --only-show-errors \
            s3://physionet-open/sleep-accel/1.0.0/ "$RUNNER_TEMP/ds/"
          ls "$RUNNER_TEMP/ds"
      - name: Onset report
        working-directory: Tools/SleepPSG
        run: swift run -c release sleeppsg --dataset "$RUNNER_TEMP/ds" --section onset
