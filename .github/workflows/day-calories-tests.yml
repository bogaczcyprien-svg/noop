# TEMPORARY: runs the Swift and Kotlin unit tests on pushes to the day-calories-baseline branch.
# Removed before this branch merges.
name: Day calories tests (temporary)

on:
  push:
    branches: [day-calories-baseline]

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: StrandAnalytics tests
        working-directory: Packages/StrandAnalytics
        run: swift test

  kotlin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testFullDebugUnitTest
