# TEMPORARY: package tests on pushes to the breathing-tab branch. Removed before this branch merges.
name: Breathing tab tests (temporary)

on:
  push:
    branches: [breathing-tab]

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: StrandAnalytics tests
        working-directory: Packages/StrandAnalytics
        run: swift test --filter "BreathingSignalTests|BreathProtocolPlayerTests"
      - name: StrandImport tests
        working-directory: Packages/StrandImport
        run: swift test
